<!-- TESTIMONIALS -->
<section id="testimonials">
  <div class="container">
    <div class="testimonials-inner" id="testimonialsInner">

      <!-- LEFT: heading + QR to Google Form -->
      <div class="testimonials-left reveal-left">
        <div class="t-large-quote">"</div>
        <div class="section-tag">Customer Reviews</div>
        <h2 class="section-title">What Our <em>Couples</em> Say</h2>
        <div class="section-divider"></div>
        <p class="section-sub">Real stories from real couples we've had the honour of photographing.</p>
        <div style="margin-top:2rem;">
          <p style="font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--orange);margin-bottom:.8rem;">❖ Share Your Experience</p>
          <div style="display:inline-block;padding:10px;border:1.5px solid var(--border);background:#fff;">
            <img id="reviewQRCode" src="" alt="Scan to leave a review" style="width:150px;height:150px;display:block;"/>
          </div>
          <p style="font-size:.7rem;color:var(--gray);margin-top:.7rem;line-height:1.7;">
            Scan with your phone camera<br>to open the review form
          </p>
        </div>
      </div>

      <!-- RIGHT: approved reviews fetched from Google Sheet -->
      <div class="testimonials-right" id="approvedReviewsList"></div>

    </div>
  </div>
</section>
