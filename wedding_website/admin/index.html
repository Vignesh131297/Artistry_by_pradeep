<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin Login — Artistry by Pradeep</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Jost',sans-serif;background:#f7f5f3;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
    .login-wrap{width:100%;max-width:400px}
    .login-brand{text-align:center;margin-bottom:2.5rem}
    .login-brand img{width:72px;height:72px;border-radius:50%;object-fit:contain;margin-bottom:1rem}
    .login-brand h1{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:300;color:#111010;letter-spacing:.04em}
    .login-brand h1 span{color:#e05424}
    .login-brand p{font-size:.65rem;letter-spacing:.25em;text-transform:uppercase;color:#6a6060;margin-top:.3rem}
    .login-card{background:#fff;border:1px solid #e8e3e0;padding:2.5rem}
    .login-title{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:300;color:#111010;margin-bottom:.3rem}
    .login-sub{font-size:.72rem;color:#9a9090;margin-bottom:2rem}
    .form-group{margin-bottom:1.2rem}
    .form-label{display:block;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:#6a6060;margin-bottom:.4rem}
    .form-control{
      width:100%;padding:.65rem .9rem;border:1px solid #e8e3e0;
      font-family:'Jost',sans-serif;font-size:.85rem;color:#111010;
      outline:none;transition:border-color .2s;background:#f7f5f3;
    }
    .form-control:focus{border-color:#e05424;background:#fff}
    .btn-login{
      width:100%;padding:.85rem;background:#e05424;color:#fff;border:none;
      font-family:'Jost',sans-serif;font-size:.72rem;font-weight:600;
      letter-spacing:.2em;text-transform:uppercase;cursor:pointer;
      transition:background .2s;margin-top:.5rem;
    }
    .btn-login:hover{background:#c04418}
    .err-msg{
      background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.25);
      color:#dc2626;font-size:.75rem;padding:.6rem .9rem;margin-bottom:1.2rem;
      display:none;
    }
    .back-link{text-align:center;margin-top:1.5rem}
    .back-link a{font-size:.68rem;color:#9a9090;letter-spacing:.1em;text-decoration:none;transition:color .2s}
    .back-link a:hover{color:#e05424}
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-brand">
    <img src="../assets/logo.png" alt="Logo" onerror="this.style.display='none'"/>
    <h1>Artistry by <span>Pradeep</span></h1>
    <p>Admin Panel</p>
  </div>
  <div class="login-card">
    <div class="login-title">Welcome back</div>
    <div class="login-sub">Sign in to manage your photography business</div>
    <div class="err-msg" id="errMsg">Incorrect username or password.</div>
    <form id="loginForm" onsubmit="doLogin(event)">
      <div class="form-group">
        <label class="form-label">Email or Username</label>
        <input class="form-control" type="email" id="uname" placeholder="Email or Username" autocomplete="email" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" id="pwd" placeholder="••••••••" autocomplete="current-password" required/>
      </div>
      <button class="btn-login" type="submit">Sign In</button>
    </form>
  </div>
  <div class="back-link"><a href="../index.html">← Back to Website</a></div>
</div>

<script src="js/db.js"></script>
<script>
  // Reset old credentials if they were using 'admin' username
  try {
    const stored = JSON.parse(localStorage.getItem('abp_auth'));
    if (stored && stored.user === 'admin') localStorage.removeItem('abp_auth');
  } catch(e) {}
  if (DB.isLoggedIn()) window.location.href = 'app.html';

  function doLogin(e) {
    e.preventDefault();
    const u = document.getElementById('uname').value.trim();
    const p = document.getElementById('pwd').value;
    if (DB.login(u, p)) {
      window.location.href = 'app.html';
    } else {
      document.getElementById('errMsg').style.display = 'block';
      document.getElementById('pwd').value = '';
      document.getElementById('pwd').focus();
    }
  }
</script>
</body>
</html>
